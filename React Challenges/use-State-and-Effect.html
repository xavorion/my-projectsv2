<!DOCTYPE html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">

      //Dito niya lahat irarun ang components
      function App() {
        const [count, setCount] = React.useState(0);
      
          function minus() {
            setCount((prev) => {
              if (prev > 0) {
                alert(`Pwedi pa ba bawasan?\nCount: ${count}`);
                return prev - 1;
              }
              return prev;
            });
          }

          React.useEffect(() => {
              if(count <= 2) 
                console.log('Low',count);
              else if (count <= 4)
                console.log('Medium',count);
              else console.log('High',count);
          },[count]);

        return(
          <>
            <button onClick={() => setCount(prev => prev + 1)}>Add</button>
            <button onClick={minus} disabled={count === 0}>Minus</button>
            <button onClick={() => setCount(prev => prev = 0)}>Reset</button>
            <p>Count Change: {count}</p>
            
          </>
        );
      }

      const container = document.querySelector('.js-container');
      const root = ReactDOM.createRoot(container);
      root.render(<App />);
    </script>
  </body>
</html>
