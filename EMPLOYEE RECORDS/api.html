<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <meta property="og:title" content="API Test">
  <meta property="og:description" content="This is a API test">
  <meta property="og:image" content="#">
  <meta property="og:url" content="#">
</head>
<body>
    <input type="text" name="pokemonName" id="pokemonName">
    <button onclick="fetchPokemon()">Fetch Pokemon</button><br>
    <img src="" alt="Image Here" >
  <script>
    const fetchPokemon = async () => {
      try {
        const pokemonName = document.getElementById('pokemonName').value.toLowerCase();
        const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName}`);

        if (!response.ok) {
          throw new Error("Could not fetch Pokémon data.");
        }

        const data = await response.json();
        console.log(data);

      } catch (error) {
        console.log(error);
      }
    };

  </script>
</body>
  
</html>
